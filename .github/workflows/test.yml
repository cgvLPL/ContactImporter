name: Test spreadsheet imports

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "feat/google-form-registration-layout-20260923"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run registration-layout tests
        run: node --test tests/*.test.js
