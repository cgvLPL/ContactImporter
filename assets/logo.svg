<svg width="1120" height="240" viewBox="0 0 1120 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ContactImporter</title>
  <desc id="desc">White ContactImporter lockup with a contact-card mark, divider, and warm CGV-style accent on a transparent background.</desc>
  <defs>
    <linearGradient id="warm" x1="282" y1="190" x2="1010" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB11F"/>
      <stop offset="0.52" stop-color="#FF6A22"/>
      <stop offset="1" stop-color="#E6322F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <g stroke="#F8F8F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="34" y="37" width="150" height="166" rx="30"/>
      <path d="M70 37V24M148 37V24"/>
      <circle cx="109" cy="91" r="27"/>
      <path d="M66 176C72 147 87 132 109 132C131 132 146 147 152 176"/>
    </g>
    <path d="M216 42V198" stroke="#767D79" stroke-width="3" stroke-linecap="round"/>

    <text x="270" y="146" fill="#F8F8F6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-5">ContactImporter</text>
    <rect x="274" y="174" width="736" height="7" rx="3.5" fill="url(#warm)"/>
  </g>
</svg>
