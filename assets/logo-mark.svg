<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ContactImporter logo mark</title>
  <desc id="desc">Dark contact-card app mark with a warm amber, orange, and red edge.</desc>
  <defs>
    <linearGradient id="warm" x1="18" y1="18" x2="142" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB11F"/>
      <stop offset="0.52" stop-color="#FF6A22"/>
      <stop offset="1" stop-color="#E6322F"/>
    </linearGradient>
    <linearGradient id="panel" x1="35" y1="22" x2="126" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242728"/>
      <stop offset="1" stop-color="#090A0B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
