    <rect x="11.5" y="11.5" width="137" height="137" rx="36.5" stroke="url(#warm)" stroke-width="3"/>
    <path d="M27 31C49 18 78 17 104 25C126 32 139 47 145 64C124 50 102 44 79 44C57 44 39 50 24 61L27 31Z" fill="white" fill-opacity="0.055"/>
  </g>

  <g stroke="#F8F8F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="44" y="44" width="72" height="78" rx="12"/>
    <path d="M61 44V35M99 44V35"/>
    <circle cx="80" cy="72" r="14"/>
    <path d="M57 108C60 94 68 87 80 87C92 87 100 94 103 108"/>
